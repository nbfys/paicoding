services:
  # ==========================================
  # 1. 基础设施层 (MySQL + Redis)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - pai-net

  redis:
    image: redis:6.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - pai-net

  # ==========================================
  # 2. AI 服务层 (JDK 17)
  # ==========================================
  ai-service:
    build: ../Helloworld/helloworld # 路径指向你的 AI 项目
    container_name: ai-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      # ⚠️ 请确保这里是你的真实 Key (sk-...)
      - SPRING_AI_DASHSCOPE_API_KEY=sk-6ebfa03e050644aa8e7147d815438067
    networks:
      - pai-net

  # ==========================================
  # 3. 业务应用层 (JDK 8)
  # ==========================================
  paicoding:
    build: . # 指向当前 paicoding 目录
    container_name: paicoding
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - redis
      - ai-service
    environment:
      # 数据库连接：使用服务名 "mysql"
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/paicoding?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      # Redis 连接：使用服务名 "redis"
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      # AI 服务连接：使用服务名 "ai-service" (配合 AiClient 代码修改)
      - AI_SERVICE_URL=http://ai-service:8081/inner/ai/summary
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pai-net

networks:
  pai-net:
    driver: bridge